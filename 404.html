<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index">
    <meta content='index' name='robots'/>
    <meta content='index' name='Googlebot'/>
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/favicon_io/android-chrome-512x512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/favicon_io/android-chrome-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon_io/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/favicon_io/android-chrome-192x192.png">
    <link rel="manifest" href="/site.webmanifest">    <title>404 - Page Does Not Exist.</title>
    <!-- Tailwind CSS -->
    <script src="/assets/js/tailwind.js"></script>
    <script src="/assets/js/particles.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="/assets/css/fonts-2.css" rel="stylesheet">
    <link href="/assets/css/fonts.css" rel="stylesheet">

</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div id="particles-js"></div>
    <div class="w-full max-w-4xl mx-auto p-4 relative z-10">
        <div class="bg-white/80 backdrop-blur-lg rounded-lg shadow-2xl p-8 md:p-12">
            <div class="text-center">
                <h1 class="text-indigo-600 font-bold text-7xl md:text-9xl">404</h1>
                <h2 class="text-2xl md:text-4xl font-bold text-gray-800 mt-4" data-lang-key="title">Ad Campaign Not Found.
                </h2>
                <p class="text-gray-600 mt-4 text-md md:text-lg" data-lang-key="subtitle">
                    It seems the link you followed is like an ad campaign with zero conversions. Let's fix that and get you back on track.
                </p>
            </div>

            <!-- Ad Performance Dashboard -->
            <div class="mt-10 border-t border-gray-200 pt-8">
                <h3 class="text-lg font-semibold text-gray-700 text-center mb-6" data-lang-key="reportTitle">Performance Report
                </h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                    <!-- Metric Card -->
                    <div class="bg-gray-50/80 p-4 rounded-lg">
                        <p class="text-sm text-gray-500" data-lang-key="clicks">Clicks</p>
                        <p class="text-2xl font-bold text-gray-800">1</p>
                    </div>
                    <!-- Metric Card -->
                    <div class="bg-gray-50/80 p-4 rounded-lg">
                        <p class="text-sm text-gray-500" data-lang-key="ctr">CTR</p>
                        <p class="text-2xl font-bold text-gray-800">100%</p>
                    </div>
                    <!-- Metric Card -->
                    <div class="bg-red-50/80 p-4 rounded-lg">
                        <p class="text-sm text-red-500" data-lang-key="conversions">Conversions</p>
                        <p class="text-2xl font-bold text-red-600">0</p>
                    </div>
                    <!-- Metric Card -->
                    <div class="bg-red-50/80 p-4 rounded-lg">
                        <p class="text-sm text-red-500" data-lang-key="roi">ROI</p>
                        <p class="text-2xl font-bold text-red-600">-100%</p>
                    </div>
                </div>
            </div>

            <div class="mt-8 text-center">
                <a href="/" class="inline-block bg-indigo-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-indigo-700 transition-colors duration-300" data-lang-key="cta">
                    العودة إلى لوحة التحكم الرئيسية
                </a>
            </div>
        </div>
    </div>
    <script src="/assets/js/404-script.js"></script>
</body>
</html>
